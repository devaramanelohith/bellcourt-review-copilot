<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#0f1f2e;--sec:#4b5b6b;--mut:#8a98a6;--line:#e2e8ee;--side:#0a1f2b;--side2:#0f3341;--pri:#0f766e;--pri2:#0b5f58;--tint:#e6f4f1;
--g:#15803d;--gb:#e8f5ec;--a:#b45309;--ab:#fff4e0;--r:#b91c1c;--rb:#fdecec;--v:#6d28d9;--vb:#f0eafe;--sh:0 1px 2px rgba(15,31,46,.04),0 6px 20px rgba(15,31,46,.05)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h1,h2,h3,.kpi .n,.rec .big{letter-spacing:-.015em}.kpi .n,td,.bar+span{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--pri);text-decoration:none}
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--side),var(--side2));color:#c3d0da;padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}.logo{width:36px;height:36px;border-radius:10px;display:block;flex:none;box-shadow:0 4px 12px rgba(20,184,166,.3)}
.brand b{color:#fff;font-size:15px;display:block;line-height:1.1}.brand small{font-size:11px;color:#94a3b8}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:#cbd5e1;border:0;background:none;width:100%;text-align:left}
.nv:hover{background:rgba(255,255,255,.06)}.nv.on{background:rgba(45,212,191,.16);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #2dd4bf}.nv .ct{margin-left:auto;background:rgba(255,255,255,.12);border-radius:99px;padding:0 8px;font-size:11.5px}
.nv svg{width:17px;height:17px;flex:none;opacity:.9}.sp{flex:1}.me{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;font-size:12.5px}.me b{color:#fff;display:block}
.sv{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 0}.sv span{font-size:10.5px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.1)}.sv .ok{background:rgba(34,197,94,.25);color:#bbf7d0}.sv .no{background:rgba(250,204,21,.2);color:#fde68a}
main{padding:22px 28px 60px;max-width:1380px;width:100%}
.top{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}.top h1{font-size:23px;margin:0;font-weight:700}.top p{margin:2px 0 0;color:var(--sec)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px}
.card h2{font-size:14.5px;margin:0 0 10px;display:flex;align-items:center;gap:8px}.card h3{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.kpi .n{font-size:30px;font-weight:700;letter-spacing:-.03em}.kpi .l{color:var(--sec);font-size:12.5px}
table{width:100%;border-collapse:collapse}th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:10px;border-bottom:1px solid #eef2f6;vertical-align:top}tr.rw{cursor:pointer}tr.rw:hover td{background:#f3faf8}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:650;white-space:nowrap}
.APPROVE_READY,.APPROVED,.MET,.ok{background:var(--gb);color:var(--g)}.NEED_INFO,.PENDED_INFO,.PENDED,.NOT_DOCUMENTED,.DUE_SOON{background:var(--ab);color:var(--a)}
.ROUTE_PHYSICIAN,.ROUTED_PHYSICIAN,.ROUTED{background:var(--vb);color:var(--v)}.ROUTE_NOT_COVERED,.DENIED_MEDICAL_NECESSITY,.DENIED_NOT_COVERED,.NOT_MET,.OVERDUE{background:var(--rb);color:var(--r)}
.URGENT{background:#ffe8d9;color:#b54708}.STANDARD,.NOT_APPLICABLE,.MANUAL_REVIEW,.NEW,.REVIEWED,.DECIDED{background:#edf1f4;color:var(--sec)}.NEW{background:#e0f2fe;color:#075985}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px;color:var(--sec);margin:1px 3px 1px 0;background:#fff}.tag.hot{border-color:#f5b5ae;color:var(--r);background:#fff8f7}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--pri2)}.btn.g{background:#fff;color:var(--ink);border-color:var(--line)}.btn.g:hover{background:#f8fafc}.btn.d{background:#fff;color:var(--r);border-color:#f1b8b2}.btn.ok2{background:var(--g);border-color:var(--g)}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}.btn svg{width:16px;height:16px;flex:none}
.seg{display:inline-flex;background:#e9edf3;border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--sec);font-weight:600}.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,118,110,.16)}label{display:block;font-size:12.5px;color:var(--sec);font-weight:600;margin-bottom:10px}label>*{margin-top:4px;font-weight:400;color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1000px){#app{grid-template-columns:1fr}aside{position:static;height:auto}.grid2,.g3,.g2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:140px 1fr;gap:5px 12px}.kv b{color:var(--sec);font-weight:500}
pre{font:12.3px/1.55 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;margin:6px 0}
.rec{border-radius:14px;padding:16px 18px;margin-bottom:14px;border:1px solid}.rec.APPROVE_READY{background:linear-gradient(180deg,#eefaf1,#fff);border-color:#b7e3c4}.rec.NEED_INFO{background:linear-gradient(180deg,#fff8e8,#fff);border-color:#f2d9a0}
.rec.ROUTE_PHYSICIAN{background:linear-gradient(180deg,#f5f1ff,#fff);border-color:#d6caf7}.rec.ROUTE_NOT_COVERED{background:linear-gradient(180deg,#fff1ef,#fff);border-color:#f3c2bc}.rec.MANUAL_REVIEW{background:#f8fafc;border-color:var(--line)}
.rec .big{font-size:19px;font-weight:750;letter-spacing:-.01em}.ic{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.steps{display:flex;gap:0;margin:0 0 14px}.steps div{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative;padding-top:22px}.steps div:before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:#cbd5e1;transform:translateX(-50%);z-index:1}
.steps div:after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:#e2e8f0}.steps div:first-child:after{display:none}.steps .dn{color:var(--ink);font-weight:600}.steps .dn:before{background:var(--pri)}.steps .dn:after{background:var(--pri)}
.rw:hover td{background:#f3faf8!important}
.muted{color:var(--sec);font-size:12.5px}q{color:var(--sec);font-style:italic}.drop{border:2px dashed #99d6cc;border-radius:12px;padding:26px;text-align:center;background:#f4fbf9;cursor:pointer}.drop:hover{background:#e6f4f1}
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 30px rgba(15,31,46,.1);padding:34px 40px;font:14px/1.65 "Source Serif 4",Georgia,serif;white-space:pre-wrap;max-width:760px}
#toast{position:fixed;bottom:22px;right:22px;background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--sh);display:none;z-index:50;max-width:420px}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;place-items:center;z-index:40;padding:20px}#modal .box{background:#fff;border-radius:16px;max-width:860px;width:100%;max-height:86vh;overflow:auto;padding:20px 24px}
.sec.hit{background:#fffbea;border-left:3px solid #f59e0b;padding-left:10px}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 15% 0,#155e6b,transparent),radial-gradient(700px 500px at 100% 100%,#0f3341,transparent),#0a1f2b}
.login .card{width:390px;padding:28px}.bar{height:5px;border-radius:9px;background:#e9edf3;overflow:hidden;margin-top:4px;width:90px}.bar i{display:block;height:100%}
img.fax{width:100%;border:1px solid var(--line);border-radius:10px}
.RECEIVED{background:#e0f2fe;color:#075985}.IN_REVIEW{background:var(--vb);color:var(--v)}.INFO_NEEDED{background:var(--ab);color:var(--a)}.PASS{background:var(--gb);color:var(--g)}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}.ctl:last-child{border-bottom:0}.ctl b{display:block;font-size:14px}.ctl .muted{margin-top:2px}
.proof{grid-column:1/-1;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}.proof .note{color:var(--sec);margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:1000px){.two{grid-template-columns:1fr}.ctl{grid-template-columns:1fr}}
.cm{border-collapse:collapse}.cm td,.cm th{text-align:center;padding:6px 10px;border:1px solid var(--line);font-size:12.5px}.cm td.d{background:var(--gb);font-weight:700}.cm td.x{background:var(--rb);font-weight:700}.cm th.r{text-align:left}.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body><div id="root"></div><div id="toast"></div><div id="modal" onclick="if(event.target.id=='modal')closeModal()"><div class="box" id="mbox"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L={APPROVE_READY:"Approve-ready",NEED_INFO:"Need information",ROUTE_PHYSICIAN:"Route to physician",ROUTE_NOT_COVERED:"Not covered: route",MANUAL_REVIEW:"Manual review",APPROVED:"Approved",PENDED_INFO:"Pended for information",ROUTED_PHYSICIAN:"Routed to physician",
DENIED_MEDICAL_NECESSITY:"Denied: medical necessity",DENIED_NOT_COVERED:"Denied: not covered",NEW:"New, not reviewed",REVIEWED:"Awaiting decision",ROUTED:"With physician",PENDED:"Waiting on provider",DECIDED:"Decided",OVERDUE:"Overdue",URGENT:"Urgent",DUE_SOON:"Due soon",STANDARD:"Standard",
MET:"Met",NOT_MET:"Not met",NOT_DOCUMENTED:"Not documented",NOT_APPLICABLE:"n/a",RECEIVED:"Received",IN_REVIEW:"Under review",INFO_NEEDED:"Information needed",PASS:"Pass"};
const VR={COVERED_SUBJECT_TO_CRITERIA:"APPROVE_READY",COVERED_WITH_CONDITIONS:"NEED_INFO",NOT_COVERED:"ROUTE_NOT_COVERED",NOT_ELIGIBLE:"ROUTE_NOT_COVERED",UNKNOWN:"MANUAL_REVIEW"},VD={COVERED_SUBJECT_TO_CRITERIA:"MET",COVERED_WITH_CONDITIONS:"NOT_DOCUMENTED",NOT_COVERED:"NOT_MET",NOT_ELIGIBLE:"NOT_MET",UNKNOWN:"STANDARD"};
const PK={EXCLUSION:"NOT_MET",EXCLUSION_EXCEPT:"NOT_DOCUMENTED",CONDITION:"NOT_DOCUMENTED",LIMIT:"NOT_DOCUMENTED",AMENDMENT:"MET",AMENDMENT_NOT_YET:"NOT_MET",MENTION:"STANDARD"};
const STAFF=r=>["nurse","physician","intake","auditor"].includes(r),CANC=r=>["intake","provider"].includes(r);
const I={q:'<path d="M3 5h14M3 10h14M3 15h9"/>',n:'<path d="M10 4v12M4 10h12"/>',l:'<path d="M3 5h14v10H3zM3 6l7 5 7-5"/>',b:'<path d="M4 3h9l3 3v11H4zM7 9h6M7 12h6"/>',h:'<circle cx="10" cy="10" r="7"/><path d="M10 9v5M10 6.5v.5"/>',e:'<path d="M4 16V9M10 16V4M16 16v-5"/>',a:'<path d="M5 4h10v13H5zM8 8h4M8 11h4"/>',c:'<path d="M10 2l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V5z"/><path d="M7 10l2 2 4-4"/>',s:'<path d="M5 9V6a5 5 0 0110 0v3"/><rect x="3" y="9" width="14" height="9" rx="2"/>'};
const ic=k=>`<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const NAVS={provider:[["My requests","q"],["Submit a request","n"],["Coverage check","c"],["Decision letters","l"],["How it works","h"]],agent:[["Status desk","q"],["Coverage check","c"],["How it works","h"]],
 staff:[["Queue","q"],["New case","n"],["Coverage check","c"],["Decision letters","l"],["Policy library","b"],["Governance & security","s"],["Evidence","e"],["How it works","h"],["Audit log","a"]]};
const navFor=r=>r=="provider"?NAVS.provider:r=="agent"?NAVS.agent:NAVS.staff.filter(([t])=>!(t=="New case"&&!CANC(r)));
const CLIENTS=[["HARLAN","Harlan Freight Lines"],["KESTREL","Kestrel Precision Manufacturing"],["BRIGHT","Brightwater Unified School District"],["JUNIPER","Juniper Foods Cooperative"],["SORREL","Sorrel Hospitality Group"],["OSTR","Ostrander Regional Medical Center"],["RB-MA","Riverbend Medicare Advantage"],["RB-ACA","Riverbend Marketplace"]];
const SVC=[["BHA-IMG-0721","Lumbar spine MRI"],["BHA-SURG-4310","Bariatric surgery"],["BHA-DME-2103","Continuous glucose monitor"],["BHA-DX-9581","In-lab sleep study"],["BHA-SURG-2988","Knee arthroscopy"],["BHA-SURG-2744","Total knee replacement"],["BHA-LAB-8162","BRCA genetic test"],["BHA-SURG-1582","Upper eyelid surgery"],["BHA-SURG-3052","Septoplasty"],["BHA-SURG-6350","Spinal cord stimulator trial"],["BHA-VASC-3647","Varicose vein ablation"],["BHA-THER-1830","Hyperbaric oxygen"],["BHA-RAD-5205","Proton beam therapy"],["BHA-REH-9711","Physical therapy beyond 12 visits"],["BHA-IMG-7519","Coronary CT angiography"],["BHA-HH-0550","Home health"],["BHA-DME-0601","CPAP continued coverage"]];
let S={tab:"Queue",cases:[],letters:[],audit:[],server:{},cur:null,me:null,filter:"mine",search:"",ev:null,score:null,letter:null},TOKEN=sessionStorage.getItem("tok")||"";
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:TOKEN?{Authorization:"Bearer "+TOKEN}:{},body:body?JSON.stringify(body):undefined});
 if(r.status==401&&path!="/api/login"){logout();throw new Error("Session expired. Sign in again.")}const j=await r.json();if(j&&j.error)throw new Error(j.error);return j}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",4200)}
function openModal(h){$("#mbox").innerHTML=h;$("#modal").style.display="grid"}function closeModal(){$("#modal").style.display="none"}
const pill=(k,t)=>`<span class="pill ${k}">${esc(t||L[k]||k)}</span>`,HOT=["EMBEDDED_INSTRUCTION","OVERDUE","NOT_ELIGIBLE_ON_DOS","UNVERIFIED_OUTPUT","MISSING_MEMBER_ID","MEMBER_NOT_VERIFIED"];
const tags=f=>(f||[]).map(x=>`<span class="tag ${HOT.includes(x.code)?"hot":""}" title="${esc(x.detail)}">${x.code.replace(/_/g," ").toLowerCase()}</span>`).join("");
function logout(){TOKEN="";sessionStorage.removeItem("tok");S.me=null;loginView()}
function loginView(msg){$("#root").innerHTML=`<div class="login"><div class="card"><div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px 0 18px;text-align:center"><img class="logo" src="/logo.svg" alt="" style="width:56px;height:56px;border-radius:15px"><div><b style="color:var(--ink);font-size:18px;display:block;letter-spacing:-.01em">Review Copilot</b><small style="color:var(--sec)">Bellcourt Health Administrators · utilization management</small></div></div>
 <form onsubmit="doLogin(event)"><label>Username<input type="text" id="lu" autocomplete="username" autofocus></label><label>Password<input type="password" id="lp" autocomplete="current-password"></label>
 <div style="color:var(--r);min-height:20px;font-size:13px">${esc(msg||"")}</div><button class="btn" style="width:100%;justify-content:center" type="submit">Sign in</button></form>
 <p class="muted" style="margin:14px 0 0">Access is limited to authorized staff. Every action is recorded against your account. Training prototype with synthetic data.</p></div></div>`}
async function doLogin(e){e.preventDefault();try{const r=await api("/api/login",{username:$("#lu").value,password:$("#lp").value});TOKEN=r.token;sessionStorage.setItem("tok",TOKEN);S.me=r;S.tab=navFor(r.role)[0][0];await load();shell()}catch(x){loginView(x.message)}}
async function load(){const d=await api("/api/cases");Object.assign(S,{cases:d.cases,letters:d.letters,audit:d.audit,server:d.server});if(S.cur)S.cur=S.cases.find(c=>c.id==S.cur.id)||S.cur}
const oc=c=>c.review?c.review.result.outcome:null;
function mine(c){const r=S.me.role,o=oc(c);if(!STAFF(r))return false;if(c.status=="DECIDED")return false;if(r=="auditor")return true;
 if(r=="intake")return c.status=="NEW"||c.status=="PENDED"||(c.status=="REVIEWED"&&o=="NEED_INFO");
 if(r=="nurse")return c.status=="NEW"||(c.status=="REVIEWED");
 return c.status=="ROUTED"||(c.status=="REVIEWED"&&(o=="ROUTE_PHYSICIAN"||o=="ROUTE_NOT_COVERED"||o=="MANUAL_REVIEW"))}
function shell(){const m=STAFF(S.me.role)?S.cases.filter(mine).length:S.cases.length,sv=S.server;$("#root").innerHTML=`<div id="app"><aside><div class="brand"><img class="logo" src="/logo.svg" alt=""><div><b>${S.me.role=="provider"?"Provider portal":S.me.role=="agent"?"Status desk":"Review Copilot"}</b><small>Bellcourt Health Administrators</small></div></div>
 ${navFor(S.me.role).map(([t,k])=>`<button class="nv ${t==S.tab?"on":""}" onclick="go('${t}')">${ic(k)}${t}${t=="Queue"||t=="My requests"?`<span class="ct">${m}</span>`:t=="Decision letters"?`<span class="ct">${S.letters.length}</span>`:""}</button>`).join("")}
 <div class="sp"></div><div class="me"><b>${esc(S.me.name)}</b>${esc(S.me.role_label)}<div class="sv"><span class="${sv.live?"ok":"no"}">${sv.live?"Model live":"Model off"}</span><span class="${sv.storage=="supabase"?"ok":"no"}">${sv.storage=="supabase"?"Supabase":"Local store"}</span><span class="${sv.email?"ok":"no"}">${sv.email?"Email on":"Email off"}</span></div>
 <button class="btn g sm" style="margin-top:10px;width:100%;justify-content:center" onclick="logout()">Sign out</button></div></aside><main id="view"></main></div>`;render()}
async function go(t){S.tab=t;try{await load()}catch(e){}shell();window.scrollTo(0,0)}
setInterval(async()=>{if(!S.me||!["Queue","My requests","Decision letters","Audit log"].includes(S.tab)||document.activeElement&&document.activeElement.tagName=="INPUT")return;try{await load();shell()}catch(e){}},20000);
function head(t,p,extra=""){return `<div class="top"><div><h1>${t}</h1><p>${p}</p></div><div class="sp" style="flex:1"></div>${extra}</div>`}
// ---------------------------------------------------------------- queue
function queue(){const open=S.cases.filter(c=>c.status!="DECIDED"),k=l=>open.filter(c=>c.priority.level==l).length;
 let rows=S.filter=="mine"?S.cases.filter(mine):S.filter=="open"?open:S.filter=="new"?S.cases.filter(c=>!c.seeded):S.cases.filter(c=>c.status=="DECIDED");
 const q=S.search.toLowerCase();if(q)rows=rows.filter(c=>JSON.stringify([c.id,c.raw.client_id,c.raw.service_requested,c.raw.patient_name,c.raw.channel]).toLowerCase().includes(q));
 return head(`Work queue`,`Sorted by time left on the decision clock. The clock starts when the request is received, on any channel.`,CANC(S.me.role)?`<button class="btn" onclick="go('New case')">${ic("n")} New case</button>`:`<span class="muted">Cases are raised by intake and provider offices. Reviewers decide.</span>`)+

 <div><label>Client<select id="qc">${CLIENTS.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("")}</select></label><label>Service<select id="qs">${SVC.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("")}</select></label><label>Date of service<input type="date" id="qd" value="2026-10-02"></label></div></div>
 <button class="btn" id="ab" onclick="doAsk()">Ask</button><div id="ans"></div></div>`}
function doAsk(){busy("ab",async()=>{const r=await api("/api/ask",{question:$("#q").value,client_id:$("#qc").value,service_code:$("#qs").value,date_of_service:$("#qd").value});
 $("#ans").innerHTML=`<h3>Answer</h3><div class="rec APPROVE_READY">${esc(r.answer)}<div class="muted" style="margin-top:6px">Citations: ${esc((r.citations||[]).join("; "))}</div></div><h3>Passages retrieved</h3>${r.hits.map(h=>`<div style="margin-bottom:6px">${pill(h.status=="GOVERNING"?"MET":"NOT_MET",h.status=="GOVERNING"?"Governing":"Not governing")} ${src(h)} <span class="muted">${esc(h.text.slice(0,150))}...</span></div>`).join("")}${(r.excluded||[]).map(e=>`<div><span class="ic NOT_MET">✕</span> <b>${e.doc_id} ${e.version||""}</b> <span class="muted">${esc(e.reason)}</span></div>`).join("")}`})}
function how(){const ch=[["Fax image or PDF","46%","An image lands on the fax share, or is uploaded here. Nobody has typed anything.","A vision model reads the form into fields. This is not template OCR: it reads different form layouts and handwriting-style text, returns empty strings for blank fields, and separately reports any sentence that tries to instruct the reviewer. Code then validates the result: member ID against the eligibility file, service name against the service list, dates parsed."],
 ["Portal","31%","The provider fills a web form. The portal calls a webhook with structured fields.","No reading step. Fields arrive structured. Also available here as the case-file upload and the form."],["Phone","15%","A provider calls. The agent keys the request during the call.","The agent uses the form on the New case page. The tool does not listen to calls. Missing items show while the caller is on the line."],
 ["Electronic (X12 278)","8%","A hospital system sends a standard transaction and PACE creates the case.","Read from the PACE read replica as structured fields."]];
 const st=[["1 Raise the case","Intake, nurse, provider feed","Form, case file, fax or PDF. Every channel becomes the same case record."],["2 Intake check","Code","Required fields checked at once. Missing items listed. Clock starts at receipt. Priority set: overdue, urgent, due soon, standard."],
 ["3 Review","Code + model","Code checks eligibility and selects the governing documents by client, service and date. The model reads those sections and tests each criterion with an exact quote. Code verifies the answer."],
 ["4 Human decision","Nurse or physician","Approve, pend for information, route to physician, or (physician only) deny. An override needs a reason."],["5 Decision letter","Created from the decision","States the specific reason, the provision relied on and appeal rights. Downloadable as PDF and sent by email."],["6 Audit","Automatic","Every create, review, decision and letter is recorded with user, role and time."]];
 const T=(hd,rows)=>`<table><tr>${hd.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td>${i?x:"<b>"+x+"</b>"}</td>`).join("")}</tr>`).join("")}</table>`;
 return head("How it works","One pipeline for every request, and a person decides at the end.")+`<div class="card"><h2>How a request arrives and how it is read</h2>${T(["Channel","Share","What arrives","How the copilot reads it"],ch)}</div>
 <div class="card"><h2>From request to decision letter</h2>${T(["Step","Who","What happens"],st)}</div>
 <div class="card"><h2>Who can do what</h2>${T(["Role","Raise a request","Run the review","Approve","Pend for information","Route to physician","Deny","Sees"],[["Provider office","Own patients (portal, fax upload)","No","No","No","No","No","Status of own requests, written notices, coverage check"],["Intake coordinator","Yes (fax share, phone, mail)","Yes","No","Yes","Yes","No","Full case"],["Nurse reviewer","No","Yes","Yes","Yes","Yes","No","Full case"],["Physician reviewer","No","Yes","Yes","Yes","n/a","Yes","Full case"],["Member services agent","No","No","No","No","No","No","Status after verifying the caller, coverage check"],["Auditor","No","No","No","No","No","No","Everything, read only"],["The copilot","n/a","n/a","Never","Drafts only","Recommends","Never","Governing documents and a de-identified record"]])}
 <div class="muted" style="margin-top:8px">Roles come from your sign-in and are enforced on the server on every request. Reviewers do not raise cases: the receipt time and the request content stay independent of the person who decides, which is what an auditor checks first.</div></div>
 <div class="card"><h2>How a request moves</h2>${T(["Stage","Who","What happens"],[["Receipt","Provider or intake","Request filed. Receipt time stamped, number issued, intake check and plan pre-check run at once. Missing items go back to the provider immediately."],["Review","Intake or nurse","Copilot run on demand: eligibility, governing rules, criteria with quotes, recommendation."],["Decision","Nurse, or physician for anything adverse","Approve, pend, route, or (physician only) deny. An override needs a reason."],["Notice","Created from the decision","Letter with reason, provision and appeal rights. Provider sees it in the portal; callers get the status from the desk."]])}</div>`}
function traceHTML(rv){const u=rv.usage||{};return `<div class="muted" style="margin-bottom:6px">Model ${esc(rv.model)} · prompt ${esc(rv.prompt_version)} · ${rv.latency_s}s · ${u.calls||0} model calls · ${u.in||0} tokens in, ${u.out||0} out · verifier ${(rv.verifier_errors||[]).length?"rejected "+rv.verifier_errors.length+" item(s), then fixed":"accepted"}</div>
 <table><tr><th style="width:150px">Step</th><th>What happened</th></tr>${(rv.trace||[]).map(t=>`<tr><td><b>${esc(t.step.replace(/_/g," "))}</b></td><td>${t.step=="model_plan"?`<q>${esc(t.reason)}</q><div class="muted">Asked to read: ${(t.read||[]).map(r=>esc(r.doc_id+" "+(r.version||"")+" §"+String(r.section).split(" ")[0])).join(", ")||"nothing"}${(t.search||[]).length?" · searched: "+esc(t.search.join("; ")):""}</div>`
 :t.step=="tool_refused"?`<span class="tag hot">refused</span> <span class="muted">${esc((t.items||[]).join(" | "))}</span>`:t.step=="safety_net_reads"?`<span class="muted">Read regardless of the plan: ${esc((t.sections||[]).join(", "))}</span>`:t.step=="search_library"?`<span class="muted">"${esc(t.query)}" → ${esc((t.results||[]).join(", "))}</span>`
 :t.step=="second_check"?`${t.ok?pill("MET","No contradiction found"):pill("NOT_MET","Problems found")} <span class="muted">${esc((t.problems||[]).join("; "))}</span>`:`Outcome ${pill(t.outcome)} ${(t.verifier_errors||[]).length?`<div class="muted">Verifier: ${esc(t.verifier_errors.join(" | "))}</div>`:'<span class="muted">verifier accepted</span>'}`}</td></tr>`).join("")}</table>`}
function evidence(){if(!S.ev)return head("Evidence","Loading...");const e=S.ev,s=e.summary,p=(a,b)=>(100*a/b).toFixed(1)+"%",sc=S.score;const O=["APPROVE","PEND_FOR_INFO","DENY_MEDICAL_NECESSITY","DENY_NOT_COVERED"],cm=s.confusion||{},miss=(e.qa||[]).filter(q=>q.tool!=q.truth);
 const rvs=S.cases.filter(c=>c.review);const tr=rvs.find(c=>c.id==S.trace)||rvs[0];
 return head("Evidence it works","Tested on Bellcourt's own audited cases, the open queue and hostile inputs.")+`<div class="kpis"><div class="kpi"><div class="n" style="color:var(--g)">${p(s.tool_correct,s.n)}</div><div class="l">Copilot agrees with the QA auditor (${s.tool_correct} of ${s.n})</div></div>
 <div class="kpi"><div class="n" style="color:var(--r)">${p(s.human_correct,s.n)}</div><div class="l">Human reviewers, same cases. Standard is 95%</div></div><div class="kpi"><div class="n">${s.wrong_approvals.length}</div><div class="l">Wrongful approvals</div></div>
 <div class="kpi"><div class="n">${s.adversarial_passed}/${s.adversarial_total}</div><div class="l">Adversarial, incomplete and wrong-input tests</div></div><div class="kpi"><div class="n">${sc.matched}/${sc.total}</div><div class="l">Open queue vs answer key</div></div></div>
 <div class="card"><h2>By the kind of mistake the human reviewer made</h2><table><tr><th>Auditor's finding on the original human decision</th><th>Copilot correct</th></tr>${Object.entries(s.by_error_type).map(([k,v])=>`<tr><td>${k=="NONE"?"No human error":k.replace(/_/g," ").toLowerCase()}</td><td>${v[0]} of ${v[1]}</td></tr>`).join("")}</table></div>
 <div class="card"><h2>What is measured, and against what</h2><table><tr><th>Dimension</th><th>Measure</th><th>Ground truth</th><th>Result</th></tr>
 <tr><td><b>Decision accuracy</b></td><td>Copilot outcome equals the QA auditor's correct decision</td><td>qa_correct_decision, 120 audited cases</td><td>${s.tool_correct} of ${s.n} (${p(s.tool_correct,s.n)}); humans ${s.human_correct} of ${s.n}</td></tr>
 <tr><td><b>Governing source</b></td><td>Document, version and section the decision rests on</td><td>qa_governing_sources</td><td>${s.source_correct} of ${s.n}</td></tr>
 <tr><td><b>Safety</b></td><td>Wrongful approvals; denials produced by the tool</td><td>Auditor's label; outcome schema</td><td>${s.wrong_approvals.length} wrongful approvals; 0 denials possible</td></tr>
 <tr><td><b>Robustness</b></td><td>Planted instructions, missing fields, wrong dates, time travel</td><td>Expected route per test</td><td>${s.adversarial_passed} of ${s.adversarial_total}</td></tr>
 <tr><td><b>Open queue</b></td><td>30 live cases, 13 of them image-only faxes</td><td>My own answer key from the policies</td><td>${sc.matched} of ${sc.total}</td></tr>
 <tr><td><b>Consistency</b></td><td>Repeat runs of the open queue</td><td>Same key</td><td>27 to 29 of 30 across runs; every miss toward a person</td></tr>
 <tr><td><b>Deterministic code</b></td><td>36 unit tests, no model call</td><td>Version by date, refusal, clock, verifier, roles, letters</td><td>36 pass</td></tr>
 <tr><td><b>Observability</b></td><td>Per-run trace: plan, reads, refusals, searches, verifier, second check, tokens, latency</td><td>Stored with every review</td><td>See below</td></tr></table>
 <div class="muted" style="margin-top:8px">Cost and speed: ${s.avg_latency}s and about ${Math.round(s.avg_tokens_in)} input tokens per case (about a third of a cent). Caveats: the QA sample may not be random; prompts were tuned while looking at these cases; a fresh audit sample is the next test.</div></div>
 <div class="two"><div class="card"><h2>Confusion matrix (auditor → copilot)</h2><table class="cm"><tr><th></th>${O.map(o=>`<th>${esc(L[o]||o.replace(/_/g," "))}</th>`).join("")}</tr>${O.map(a=>`<tr><th class="r">${esc(a.replace(/_/g," "))}</th>${O.map(b=>{const v=cm[a+" -> "+b]||0;return `<td class="${v?(a==b?"d":"x"):""}">${v||""}</td>`}).join("")}</tr>`).join("")}</table><div class="muted" style="margin-top:6px">Rows: what the auditor said was right. Columns: what the copilot recommended. Off-diagonal cells are the three misses, all of them toward a person.</div></div>
 <div class="card"><h2>The ${miss.length} misses</h2><table><tr><th>Case</th><th>Service</th><th>Auditor</th><th>Copilot</th></tr>${miss.map(q=>`<tr><td>${esc(q.id)} ${esc(q.client)}</td><td>${esc(q.service)}</td><td>${pill(q.truth)}</td><td>${pill(q.tool)}</td></tr>`).join("")}</table></div></div>
 <div class="card"><h2>Run trace: what the agent did on a real case</h2>${rvs.length?`<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><select style="max-width:360px" onchange="S.trace=this.value;render()">${rvs.map(c=>`<option value="${c.id}" ${tr&&c.id==tr.id?"selected":""}>${c.id} · ${esc(c.review.case.service_requested||"")} · ${L[c.review.result.outcome]}</option>`).join("")}</select><span class="muted">Every review stores this trace. It is what Riverbend can ask for on audit.</span></div>${traceHTML(tr.review)}`:'<div class="muted">No reviewed case loaded.</div>'}</div>
 <div class="card"><h2>Adversarial, incomplete and wrong inputs</h2><table><tr><th>Test</th><th>Expected</th><th>Got</th><th></th></tr>${e.adversarial.map(a=>`<tr><td>${esc(a.test)}</td><td>${pill(a.expected)}</td><td>${pill(a.got)}</td><td>${pill(a.passed?"MET":"NOT_MET",a.passed?"Pass":"Fail")}</td></tr>`).join("")}</table></div>
 <div class="card"><h2>Open queue against the answer key</h2><table><tr><th>Case</th><th>Expected</th><th>Copilot</th><th></th><th>Flags</th></tr>${sc.rows.map(r=>`<tr><td>${r[0]}</td><td>${pill(r[1])}</td><td>${pill(r[2])}</td><td>${pill(r[3]=="ok"?"MET":"NOT_MET",r[3]=="ok"?"Match":"Miss")}</td><td class="muted">${esc(r[4]||"")}</td></tr>`).join("")}</table></div>`}
function auditView(){return head("Audit log","Every action, with user, role and time. This is what Riverbend can request on audit.")+`<div class="card"><table><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Case</th><th>Detail</th></tr>
 ${S.audit.map(a=>`<tr><td>${a.ts}</td><td>${esc(a.name)}</td><td>${esc(a.role)}</td><td><b>${a.action.replace(/_/g," ").toLowerCase()}</b></td><td><a href="#" onclick="event.preventDefault();openCase('${a.case_id}')">${a.case_id}</a></td><td class="muted">${esc(a.detail)}</td></tr>`).join("")||'<tr><td colspan=6 class="muted">No actions yet.</td></tr>'}</table>
 <div class="muted" style="margin-top:8px">Stored in ${S.server.storage=="supabase"?"Supabase (Postgres)":"a local file on this server. Connect Supabase to persist across restarts"}.</div></div>`}
// ---------------------------------------------------------------- provider portal and status desk
function pubCard(c,hi){return `<div class="card" style="${hi?"border-color:#5eead4;box-shadow:0 0 0 3px rgba(20,184,166,.15)":""}"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="font-size:15px">${c.id}</b>${pill(c.status)}${c.urgency=="URGENT"?pill("URGENT"):""}<span class="muted">${esc(c.service||"Service not identified")} · ${esc(c.patient_name||"")} · received ${c.received_ts} by ${esc(c.channel)}</span><div style="flex:1"></div>${c.letter_id?`<a class="btn sm" target="_blank" href="/api/cases?letter=${c.letter_id}&t=${TOKEN}">Download the notice (PDF)</a>`:""}</div>
 <div class="g3" style="margin-top:10px"><div><h3>Status</h3><div>${esc(c.label)}</div><div class="muted">Decision due ${c.due}${c.hours_remaining<0?" (overdue)":" ("+c.hours_remaining+"h left)"}. The clock started at receipt.</div></div>
 <div><h3>Still needed from the provider</h3>${(c.missing||[]).length?c.missing.map(m=>`<div>${mark("NOT_DOCUMENTED")} ${esc(m)}</div>`).join(""):`<div>${mark("MET")} Nothing. The request was complete on receipt.</div>`}</div>
 <div><h3>Plan check at receipt</h3>${c.precheck?`<div>${pill(VD[c.precheck.status]||"STANDARD",c.precheck.headline)}</div><div class="muted">${c.precheck.plan?esc(c.precheck.plan)+" · ":""}${c.precheck.policy?"criteria from "+esc(c.precheck.policy):""}${(c.precheck.provisions||[]).length?" · "+esc(c.precheck.provisions.join(", ")):""}</div>`:'<div class="muted">Plan not identified yet.</div>'}</div></div></div>`}
function providerHome(){const cs=S.cases,n=k=>cs.filter(c=>c.status==k).length;
 return head("My requests","Requests raised by your office. The status updates here, so there is no need to call.",`<button class="btn" onclick="go('Submit a request')">${ic("n")} Submit a request</button>`)+
 `<div class="kpis">${[["RECEIVED","Received, in the queue",""],["IN_REVIEW","Under review",""],["INFO_NEEDED","Information needed","color:var(--a)"],["DECIDED","Decided","color:var(--g)"]].map(([k,l,st])=>`<div class="kpi"><div class="n" style="${st}">${n(k)}</div><div class="l">${l}</div></div>`).join("")}</div>
 ${cs.length?cs.map(c=>pubCard(c,c.id==S.hi)).join(""):`<div class="card muted">No requests yet. Run a coverage check first, then submit the request.</div>`}`}
function statusDesk(){return head("Status desk","For callers asking about a request. Verify the caller first: the request number and the patient's date of birth must both match before anything is read out.")+
 `<div class="card"><div class="g3"><label>Request number<input type="text" id="l_id" placeholder="PA-2609-8100"></label><label>Patient date of birth<input type="date" id="l_dob"></label><div style="display:flex;align-items:flex-end"><button class="btn" id="lb" onclick="doLookup()">Verify and look up</button></div></div>
 <div class="muted">Every lookup, successful or not, is written to the audit log under your name.</div></div><div id="lres"></div>
 <div class="card"><h2>Call script</h2><ol style="margin:0;padding-left:18px;color:var(--sec)"><li>Ask for the request number and the patient's date of birth. Read nothing back until both match.</li><li>Give the status line and the decision due date. The clock runs from receipt, so you can confirm when the fax arrived.</li><li>If information is needed, read the list and offer the fax number (615) 555-0142.</li><li>Never discuss the clinical review or a likely outcome. Decisions are made by Bellcourt clinicians and sent in writing.</li></ol></div>`}
function doLookup(){busy("lb",async()=>{try{const c=await api("/api/cases",{action:"lookup",case_id:$("#l_id").value,dob:$("#l_dob").value});$("#lres").innerHTML=pubCard(c,true)}catch(e){$("#lres").innerHTML=`<div class="card" style="color:var(--r)"><b>Nothing disclosed.</b> ${esc(e.message)}</div>`}})}

function coverageView(){return head("Coverage check","Before a request is filed: is the member eligible, does the plan cover the service on that date, which criteria will apply, and what to send. Rules only, no model, instant. The same screen serves provider offices and the phone desk.")+
 `<div class="card"><div class="g3"><label>Member ID (optional, sets the plan)<input type="text" id="c_member" placeholder="for example RBM96929364"></label>
 <label>Health plan or employer<select id="c_client"><option value="">From the member ID</option>${CLIENTS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}</select></label>
 <label>Service<select id="c_service">${SVC.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("")}</select></label>
 <label>Planned date of service<input type="date" id="c_dos" value="2026-10-12"></label><label>Urgency<select id="c_urg"><option>STANDARD</option><option>URGENT</option></select></label>
 <div style="display:flex;align-items:flex-end;padding-bottom:10px"><button class="btn" id="ccb" onclick="runCoverage()">Check coverage</button></div></div></div><div id="cres">${S.cov?covResult(S.cov):""}</div>`}
function runCoverage(){busy("ccb",async()=>{const r=await api("/api/cases",{action:"coverage",member_id:$("#c_member").value,client_id:$("#c_client").value,service_code:$("#c_service").value,date_of_service:$("#c_dos").value,urgency:$("#c_urg").value});S.cov=r;$("#cres").innerHTML=covResult(r)})}
function covResult(r){const v=r.verdict,el=r.eligibility||{};return `<div class="rec ${VR[v.status]||"MANUAL_REVIEW"}"><div class="big">${esc(v.headline)}</div><div>${esc(v.detail)}</div><div class="muted" style="margin-top:6px">${esc(r.service||"")} · ${esc(r.client_id||"no plan identified")} · date of service ${esc(r.date_of_service||"?")}${r.clock?` · decision within ${r.clock.sla_hours} hours of receipt (${r.clock.product})`:""}</div></div>
 <div class="grid2"><div><div class="card"><h2>Member</h2>${pill(el.status=="ELIGIBLE"?"MET":el.status=="NOT_ELIGIBLE"?"NOT_MET":"NOT_DOCUMENTED",el.status)} ${esc(el.reason||"")}${el.member_state?` · state ${el.member_state}`:""}</div>
 <div class="card"><h2>What the plan says</h2>${r.plan?`<div class="muted" style="margin-bottom:6px">${esc(r.plan.title)} (${r.plan.doc_id}). Rank ${r.plan.rank}: the plan document outranks Bellcourt policy.</div>`:""}${(r.provisions||[]).filter(p=>p.kind!="MENTION").map(p=>`<div style="margin-top:8px">${pill(PK[p.kind]||"STANDARD",p.kind.replace(/_/g," ").toLowerCase())} ${src({doc_id:p.doc_id,section:p.section})} <b>${esc(p.title)}</b><div class="muted">${esc(p.excerpt)}</div></div>`).join("")||'<div class="muted">No exclusion, limit or condition in the plan mentions this service.</div>'}</div>
 <div class="card"><h2>What to send with the request</h2>${(r.checklist||[]).map(x=>`<div style="margin-bottom:3px">${mark("NOT_DOCUMENTED")} ${esc(x)}</div>`).join("")}</div></div>
 <div>${r.policy?`<div class="card"><h2>Criteria that will apply: ${r.policy.doc_id} ${r.policy.version}</h2><div class="muted">${esc(r.policy.title)} · in force ${r.policy.effective_from}${r.policy.effective_to?" to "+r.policy.effective_to:" until superseded"} · ${src({doc_id:r.policy.doc_id,version:r.policy.version,section:"3"})}</div><pre>${esc(r.policy.criteria)}</pre>${r.policy.limitations?`<h3>Not medically necessary</h3><div class="muted">${esc(r.policy.limitations)}</div>`:""}</div>`:""}
 ${(r.excluded||[]).length?`<div class="card"><h2>Deliberately not used</h2>${r.excluded.map(e=>`<div style="margin-bottom:4px"><span class="ic NOT_MET">✕</span> <b>${e.doc_id} ${e.version||""}</b> <span class="muted">${esc(e.reason)}</span></div>`).join("")}</div>`:""}</div></div>`}
// ---------------------------------------------------------------- governance and security: live proofs
const CTL=[["No denial outcome exists","The model's answer schema allows four outcomes: approve-ready, need information, route to physician, not covered. The verifier rejects anything else, so the tool cannot deny.","outcomes"],
 ["Only a physician can deny, and the server enforces every role","Try to approve and to deny as your own role, without saving. Reviewers cannot raise cases; intake and provider offices cannot decide.","role_gate"],
 ["Code picks the rule; the read tool refuses the rest","For a client, service and date, the governing documents are selected by effective date and authority rank. Retired versions and memos are excluded with a reason and cannot be read by the model.","refused_read"],
 ["Identifiers are stripped before the model sees the record","Name, date of birth, record number and phone are removed. The model receives a de-identified narrative and the age on the date of service.","deid"],
 ["Provider text is data, not instructions","Sentences that try to direct the reviewer are flagged for the human and cannot be used as evidence.","planted"],
 ["Passwords are never stored","Salted PBKDF2 hashes with 200,000 rounds; constant-time comparison; the same work for unknown users.","users"],
 ["Sessions are signed and expire","Your own token decoded, then a tampered token and a forged role checked by the server.","token"],
 ["Case data needs a sign-in","Fetch the case list, the evaluation data and a fax image with no token.","anon"],
 ["State rules are applied automatically","Arizona medical director sign-off, Texas AI disclosure, Georgia human review, by member state and product.","state_rules"],
 ["The clock starts at receipt, on any channel","Riverbend addendum Section 3. Urgency on the form wins over the header and the conflict is flagged.","clock"],
 ["Everything is written to the audit log","Who did what, when, on which case. A review stores its inputs, governing documents, trace, output and verifier report.","audit"]];
function controlsView(){return head("Governance and security","Each control below is a live check against the running server, not a statement. Click one to see the real response.",`<button class="btn g" onclick="proveAll()">Run all</button>`)+
 `<div class="card"><h2>Governance: who decides, under which rule</h2>${CTL.slice(0,3).map(ctlRow).join("")}</div><div class="card"><h2>Patient data and untrusted input</h2>${CTL.slice(3,5).map(ctlRow).join("")}</div>
 <div class="card"><h2>Access</h2>${CTL.slice(5,8).map(ctlRow).join("")}</div><div class="card"><h2>Regulatory rules and the audit trail</h2>${CTL.slice(8).map(ctlRow).join("")}</div>
 <div class="card"><h2>Outside the prototype</h2><div class="muted">Production would run inside Bellcourt's Azure tenant, which already holds the HIPAA business associate agreement, behind single sign-on (Entra ID) with the same role model, after the 60-day written notice to Riverbend required by addendum Section 5. The audit table moves to the database with retention per Bellcourt's record policy. None of the controls above change; they are already in code.</div></div>`}
const ctlRow=([t,d,k],i)=>`<div class="ctl" id="ctl_${k}"><div><b>${t}</b><div class="muted">${d}</div></div><div style="text-align:right"><button class="btn g sm" id="pb_${k}" onclick="prove('${k}')">Show proof</button></div></div>`;
async function proveAll(){for(const [,,k] of CTL){await prove(k)}}
async function prove(k){const row=$("#ctl_"+k);let old=row.querySelector(".proof");if(old)old.remove();const b=$("#pb_"+k);b.disabled=true;b.textContent="Checking...";
 try{let r;if(k=="anon"){const codes=await Promise.all(["/api/cases","/api/data?name=eval","/api/data?fax=FAX-PA-2609-8100.png"].map(u=>fetch(u).then(x=>x.status)));r={requests:["/api/cases","/api/data?name=eval","/api/data?fax=FAX-PA-2609-8100.png"].map((u,i)=>({url:u,status:codes[i],result:codes[i]==401?"refused: not signed in":"returned"})),note:"Every data route checks the session before reading a file. Fax images are served only with a valid token."}}
 else r=await api("/api/cases",{action:"prove",kind:k,token:TOKEN});row.insertAdjacentHTML("beforeend",`<div class="proof">${proofHTML(k,r)}<div class="note">${esc(r.note||"")}</div></div>`);b.textContent="Checked";b.classList.add("ok2");b.style.color="#fff"}
 catch(e){row.insertAdjacentHTML("beforeend",`<div class="proof" style="color:var(--r)">${esc(e.message)}</div>`);b.textContent="Show proof";b.disabled=false}}
function proofHTML(k,r){const P=o=>`<pre style="margin:4px 0">${esc(JSON.stringify(o,null,1))}</pre>`,row=(a,b)=>`<div style="display:flex;gap:8px;margin:3px 0"><span style="min-width:200px" class="muted">${a}</span><span>${b}</span></div>`;
 if(k=="outcomes")return row("Allowed outcomes",r.allowed_outcomes.map(o=>pill(o)).join(" "))+row("Tried to submit","<b>DENY</b>")+row("Verifier said",`<span class="tag hot">rejected</span> ${esc(r.verifier_said[0])}`);
 if(k=="role_gate")return `<table style="margin-bottom:6px"><tr><th>Decision</th><th>Roles allowed</th></tr>${Object.entries(r.matrix).map(([d,rs])=>`<tr><td>${pill(d)}</td><td>${rs.join(", ")}</td></tr>`).join("")}<tr><td>Raise a request</td><td>${r.create_roles.join(", ")}</td></tr><tr><td>Run the review</td><td>${r.review_roles.join(", ")}</td></tr></table>`+row(`Live attempt as <b>${esc(r.your_role)}</b>${r.tried_on?" on "+r.tried_on:""}`,r.attempts.map(a=>`<div>${pill(a.decision)} → ${a.result.startsWith("REFUSED")?'<span class="tag hot">403</span> ':""}${esc(a.result)}</div>`).join(""));
 if(k=="refused_read")return row("Case",`${r.client_id} · ${r.service_code} · date of service ${r.date_of_service}`)+row("Governing (code-selected)",r.governing.map(g=>`<div>${esc(g)}</div>`).join(""))+row("Excluded, with reason",r.excluded.map(g=>`<div><span class="ic NOT_MET">✕</span> ${esc(g)}</div>`).join(""))+row("Model asks to read a retired version",(r.read_attempt||[]).map(x=>`<span class="tag hot">${esc(x.error||"")}</span>`).join("")||"n/a");
 if(k=="deid")return `<div class="two"><div><b>Before</b><pre>${esc(r.before)}</pre></div><div><b>After (what the model sees)</b><pre>${esc(r.after)}</pre></div></div>`;
 if(k=="planted")return `<pre>${esc(r.text)}</pre>`+row("Flagged as an instruction",r.flagged.map(f=>`<span class="tag hot">${esc(f)}</span>`).join(" ")||"none");
 if(k=="users")return `<table>${r.users.map(u=>`<tr><td><b>${esc(u.username)}</b> <span class="muted">${esc(u.role)}</span></td><td class="muted">${esc(u.stored)}</td></tr>`).join("")}</table><div class="muted">${esc(r.users[0].algorithm)}</div>`;
 if(k=="token")return row("Your session",`${esc(r.payload.n)} · role <b>${esc(r.payload.r)}</b> · expires in ${r.expires_in_minutes} min`)+row("Tampered token accepted?",r.tampered_token_accepted?'<span class="tag hot">yes</span>':pill("MET","No, rejected"))+row("Role edited to physician, accepted?",r.forged_role_accepted?'<span class="tag hot">yes</span>':pill("MET","No, signature fails"));
 if(k=="anon")return `<table>${r.requests.map(x=>`<tr><td><code>${esc(x.url)}</code></td><td>${x.status==401?pill("MET","401 "+x.result):`<span class="tag hot">${x.status}</span>`}</td></tr>`).join("")}</table>`;
 if(k=="state_rules")return `<table><tr><th>Client</th><th>State</th><th>Recommendation</th><th>Flags added</th></tr>${r.rows.map(x=>`<tr><td>${x.client}</td><td>${x.state}</td><td>${pill(x.outcome)}</td><td>${x.flags.map(f=>`<span class="tag">${f.replace(/_/g," ").toLowerCase()}</span>`).join("")||'<span class="muted">none (ERISA plan)</span>'}</td></tr>`).join("")}</table>`;
 if(k=="clock")return `<div class="muted">Demo clock: ${r.now}</div><table><tr><th>Client</th><th>Received</th><th>Header / form</th><th>Clock</th><th>Due</th><th>Left</th></tr>${r.rows.map(x=>`<tr><td>${x.client}</td><td>${x.received}</td><td>${x.header} / ${x.form||"–"}${x.conflict?' <span class="tag hot">conflict</span>':""}</td><td>${x.sla_hours}h ${x.effective_urgency.toLowerCase()}</td><td>${x.due}</td><td>${x.hours_remaining}h</td></tr>`).join("")}</table>`;
 if(k=="audit")return row("Entries",`<b>${r.entries}</b> in ${esc(r.storage)}`)+row("By action",Object.entries(r.by_action).map(([a,n])=>`<span class="tag">${a.replace(/_/g," ").toLowerCase()} ${n}</span>`).join(" ")||"none yet")+`<div style="margin-top:6px"><button class="btn g sm" onclick="go('Audit log')">Open the audit log</button></div>`;
 return P(r)}
function render(){const v={"Queue":queue,"My requests":providerHome,"Status desk":statusDesk,"Case":caseView,"New case":newCase,"Submit a request":newCase,"Coverage check":coverageView,"Governance & security":controlsView,"Decision letters":lettersView,"Policy library":ask,"How it works":how,"Evidence":evidence,"Audit log":auditView}[S.tab];$("#view").innerHTML=v();
 if(S.tab=="Evidence"&&!S.ev)Promise.all(["eval","open_score"].map(f=>api("/api/data?name="+f))).then(([a,b])=>{S.ev=a;S.score=b;render()})}
(async()=>{if(!TOKEN)return loginView();try{S.me=await api("/api/login");if(!navFor(S.me.role).some(([t])=>t==S.tab))S.tab=navFor(S.me.role)[0][0];await load();shell()}catch(e){logout()}})();
</script></body></html>
