<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bellcourt Review Copilot</title>
<style>
:root{--ink:#0b0b0b;--sec:#52514e;--mut:#898781;--line:#e1e0d9;--bg:#f9f9f7;--card:#fff;--navy:#104281;--blue:#2a78d6;--tint:#f1f6fd;
--good:#0a7a0a;--goodbg:#e8f6e8;--warn:#9a5b00;--warnbg:#fdf3dc;--bad:#b42a2a;--badbg:#fbe9e9;--vio:#4a3aa7;--viobg:#eeebfa}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0}header small{opacity:.8}header .sp{flex:1}
select,button,input,textarea{font:inherit}header select{padding:4px 6px;border-radius:6px;border:0}
nav{display:flex;gap:4px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:11px 12px;cursor:pointer;color:var(--sec);border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--navy);border-color:var(--navy);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:16px}
.banner{background:var(--warnbg);color:var(--warn);padding:7px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px}h3{font-size:13px;margin:12px 0 5px;color:var(--sec);text-transform:uppercase;letter-spacing:.03em}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--sec);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);background:#f4f4f1}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr.row{cursor:pointer}tr.row:hover{background:var(--tint)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.APPROVE_READY{background:var(--goodbg);color:var(--good)}.NEED_INFO{background:var(--warnbg);color:var(--warn)}
.ROUTE_PHYSICIAN{background:var(--viobg);color:var(--vio)}.ROUTE_NOT_COVERED{background:var(--badbg);color:var(--bad)}.MANUAL_REVIEW{background:#eee;color:#444}
.flag{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;margin:1px 2px 1px 0;color:var(--sec)}
.flag.hot{border-color:var(--bad);color:var(--bad)}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:13px}.kv b{color:var(--sec);font-weight:500}
pre,.mono{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:#f6f6f3;border-radius:8px;padding:10px;margin:6px 0}
img.fax{width:100%;border:1px solid var(--line);border-radius:8px}
.out{padding:12px 14px;border-radius:10px;margin-bottom:10px}.out b{font-size:16px}
.st{font-weight:700;font-size:11.5px}.MET{color:var(--good)}.NOT_MET{color:var(--bad)}.NOT_DOCUMENTED{color:var(--warn)}.NOT_APPLICABLE{color:var(--mut)}
q{color:var(--sec);font-style:italic}.muted{color:var(--mut);font-size:12.5px}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;margin:3px 4px 3px 0}
.btn.alt{background:#fff;color:var(--navy)}.btn:disabled{opacity:.4;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.tile .n{font-size:26px;font-weight:700;color:var(--navy)}.tile .l{font-weight:600;font-size:13px}.tile .s{color:var(--sec);font-size:12px}
textarea,input[type=text],input[type=date],select.f{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff}
.ex{color:var(--bad)}.trace li{margin-bottom:4px;font-size:12.5px}
</style></head><body>
<header><div><h1>Bellcourt Review Copilot</h1><small>Agentic RAG for prior authorization review. The tool recommends, a person decides.</small></div><div class="sp"></div>
<small id="who"></small><small id="live"></small><button id="out" class="btn alt" style="display:none;padding:4px 10px" onclick="logout()">Sign out</button></header>
<nav id="nav"></nav><main><div class="banner">Training prototype. Bellcourt, Riverbend and every patient here are fictional and all data is synthetic. Clock is pinned to 26 Sep 2026, 09:00.</div><div id="view"></div></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL={APPROVE_READY:"Approve-ready",NEED_INFO:"Need information",ROUTE_PHYSICIAN:"Route to physician",ROUTE_NOT_COVERED:"Route: not covered",MANUAL_REVIEW:"Manual review"};
const TABS=["Worklist","Case review","How it works","New request","Ask the library","Evidence","Audit log"];
let S={tab:"Worklist",cases:[],ev:null,cur:null,live:false,model:""}, HOT=["EMBEDDED_INSTRUCTION","OVERDUE","NOT_ELIGIBLE_ON_DOS","UNVERIFIED_OUTPUT","MISSING_MEMBER_ID"];
const audit=()=>JSON.parse(localStorage.getItem("audit")||"[]"), role=()=>S.me?S.me.role_label:"";
let TOKEN=sessionStorage.getItem("tok")||"";
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:TOKEN?{Authorization:"Bearer "+TOKEN}:{},body:body?JSON.stringify(body):undefined});
 if(r.status==401&&path!="/api/login"){logout();throw new Error("Session expired. Sign in again.")}return r.json()}
function logout(){TOKEN="";sessionStorage.removeItem("tok");S.me=null;$("#nav").innerHTML="";$("#who").textContent="";$("#live").textContent="";$("#out").style.display="none";loginView()}
function loginView(msg){$("#view").innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2>Sign in</h2><div class="muted">Access is limited to Bellcourt utilization management staff. Every action is recorded against your account.</div>
 <form onsubmit="doLogin(event)" style="margin-top:10px"><label>Username<input type="text" id="lu" autocomplete="username" autofocus></label><div style="height:8px"></div>
 <label>Password<input type="password" id="lp" autocomplete="current-password" style="width:100%;padding:7px;border:1px solid var(--line);border-radius:8px"></label>
 <div class="ex" style="min-height:20px;margin-top:6px">${esc(msg||"")}</div><button class="btn" type="submit">Sign in</button></form></div>`}
async function doLogin(e){e.preventDefault();const r=await api("/api/login",{username:$("#lu").value,password:$("#lp").value}).catch(x=>({error:String(x)}));
 if(r.error)return loginView(r.error);TOKEN=r.token;sessionStorage.setItem("tok",TOKEN);start(r)}
async function start(me){S.me=me;S.live=me.live&&me.can_run_live;S.model=me.model;$("#who").textContent=me.name+" · "+me.role_label;$("#out").style.display="";
 $("#live").textContent=me.live?"Live mode: "+me.model:"Replay mode (saved results)";$("#view").innerHTML='<div class="card">Loading the queue...</div>';
 [S.cases,S.ev,S.score]=await Promise.all(["open_cases","eval","open_score"].map(f=>api("/api/data?name="+f)));nav();render()}
function nav(){$("#nav").innerHTML=TABS.map(t=>`<button class="${t==S.tab?"on":""}" onclick="go('${t}')">${t}</button>`).join("")}
function go(t){S.tab=t;nav();render()}
const chip=o=>`<span class="chip ${o}">${LABEL[o]||o}</span>`, flags=f=>(f||[]).map(x=>`<span class="flag ${HOT.includes(x.code)?"hot":""}" title="${esc(x.detail)}">${x.code}</span>`).join("");
function worklist(){const rows=[...S.cases].sort((a,b)=>a.clock.hours_remaining-b.clock.hours_remaining);
 const n=o=>S.cases.filter(c=>c.result.outcome==o).length;
 return `<div class="tiles" style="margin-bottom:12px">${["APPROVE_READY","NEED_INFO","ROUTE_PHYSICIAN","ROUTE_NOT_COVERED","MANUAL_REVIEW"].map(o=>`<div class="tile"><div class="n">${n(o)}</div><div class="l">${LABEL[o]}</div></div>`).join("")}
 <div class="tile"><div class="n">${S.cases.filter(c=>c.case.channel=="FAX").length}</div><div class="l">Faxes read by the tool</div><div class="s">None had been keyed into PACE</div></div></div>
 <div class="card"><h2>Open queue, most urgent first (${rows.length} requests)</h2><table><tr><th>Case</th><th>Client</th><th>Channel</th><th>Service</th><th>Due</th><th>Hours left</th><th>Recommendation</th><th>Flags</th></tr>
 ${rows.map(c=>`<tr class="row" onclick="openCase('${c.case.case_id}')"><td><b>${c.case.case_id.slice(-4)}</b></td><td>${c.case.client_id}</td><td>${c.case.channel}</td><td>${esc(c.case.service_requested||"not identified")}</td>
 <td>${c.clock.due} ${c.clock.effective_urgency=="URGENT"?'<span class="flag hot">URGENT</span>':""}</td><td class="${c.clock.hours_remaining<0?"ex":""}"><b>${c.clock.hours_remaining}</b></td><td>${chip(c.result.outcome)}</td><td>${flags(c.flags)}</td></tr>`).join("")}</table></div>`}
function openCase(id){S.cur=S.cases.find(c=>c.case.case_id==id);go("Case review")}
function checks(list){return (list||[]).map(c=>`<tr><td><span class="st ${c.status}">${c.status}</span></td><td>${esc(c.criterion)}${c.evidence_quote?`<br><q>"${esc(c.evidence_quote)}"</q>`:""}${c.note?`<br><span class="muted">${esc(c.note)}</span>`:""}</td><td class="muted">${esc((c.source||{}).doc_id||"")} ${esc((c.source||{}).version||"")} s${esc((c.source||{}).section||"")}</td></tr>`).join("")}
function caseView(c){if(!c)return `<div class="card">Pick a case from the worklist.</div>`;const k=c.case,r=c.result,ps=r.primary_source||{};
 const decided=audit().filter(a=>a.case_id==k.case_id).slice(-1)[0];
 const rk=S.me.role,canApprove=rk=="nurse"||rk=="physician",canAdverse=rk=="physician",canSend=rk!="auditor";
 return `<div class="grid"><div>
 <div class="card"><h2>Request ${k.case_id}</h2><div class="kv"><b>Client</b><span>${k.client_id} (${c.eligibility.member_state||"state unknown"})</span><b>Channel</b><span>${k.channel}</span><b>Received</b><span>${k.received_ts}</span>
 <b>Decision due</b><span>${c.clock.due} (${c.clock.sla_hours}h clock from receipt, ${c.clock.hours_remaining}h left)</span><b>Service</b><span>${esc(k.service_requested)} ${k.service_code?`(${k.service_code})`:""}</span>
 <b>Date of service</b><span>${esc(k.date_of_service)}</span><b>Member ID</b><span>${esc(k.member_id||"missing")}</span><b>Eligibility</b><span>${c.eligibility.status}: ${esc(c.eligibility.reason)}</span></div>
 <h3>Flags</h3>${(c.flags||[]).map(f=>`<div><span class="flag ${HOT.includes(f.code)?"hot":""}">${f.code}</span> <span class="muted">${esc(f.detail)}</span></div>`).join("")||'<span class="muted">None</span>'}
 <h3>Clinical record sent to the model (identifiers removed)</h3><pre>${esc(c.record)}</pre>
 ${k.fax_image?`<h3>Original fax</h3><img class="fax" src="/api/data?fax=${k.fax_image.split("/").pop()}&t=${TOKEN}"><h3>Fields read from the fax</h3><pre>${esc(JSON.stringify(k.fax,null,1))}</pre>`:""}</div></div>
 <div><div class="out ${r.outcome}"><b>${LABEL[r.outcome]}</b>${c.expected?` <span class="muted">answer key: ${LABEL[c.expected]}</span>`:""}<div style="margin-top:6px">${esc(r.rationale)}</div>
 ${ps.doc_id?`<div class="muted" style="margin-top:6px">Deciding provision: <b>${esc(ps.doc_id)} ${esc(ps.version||"")}, Section ${esc(ps.section)}</b></div>`:""}</div>
 <div class="card"><h2>Which rules govern this case</h2><table><tr><th>Document</th><th>Rank</th><th>In force</th><th>Why</th></tr>${(c.governing||[]).map(g=>`<tr><td><b>${g.doc_id} ${g.version||""}</b><br><span class="muted">${esc(g.title)}</span></td><td>${g.rank}</td><td>${g.effective_from||""} ${g.effective_to?"to "+g.effective_to:""}</td><td class="muted">${esc(g.why)}</td></tr>`).join("")}</table>
 ${(c.excluded||[]).length?`<h3>Deliberately not used</h3>${c.excluded.map(e=>`<div class="ex">&#10005; <b>${e.doc_id} ${e.version||""}</b> <span class="muted">${esc(e.reason)}</span></div>`).join("")}`:""}</div>
 <div class="card"><h2>Checklist with evidence</h2><table><tr><th>Status</th><th>Coverage under the plan</th><th>Source</th></tr>${checks(r.coverage_checks)}<tr><th>Status</th><th>Medical necessity criteria</th><th>Source</th></tr>${checks(r.criteria)}</table>
 ${(r.missing_information||[]).length?`<h3>Missing information</h3><ul>${r.missing_information.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`:""}</div>
 ${c.info_request?`<div class="card"><h2>Draft fax back to the provider</h2><div class="muted">Prepared at intake so the provider hears the same hour. A person reviews and sends it.</div><pre>${esc(c.info_request)}</pre></div>`:""}
 ${r.letter_paragraph?`<div class="card"><h2>Draft letter paragraph (for the human decision maker)</h2><pre>${esc(r.letter_paragraph)}</pre></div>`:""}
 <div class="card"><h2>Human decision</h2>${decided?`<div class="banner" style="background:var(--goodbg);color:var(--good)">Recorded: ${esc(decided.action)} by ${esc(decided.role)} at ${decided.ts}</div>`:""}
 <button class="btn" ${canApprove&&r.outcome=="APPROVE_READY"?"":"disabled"} onclick="decide('Approved')">Confirm approval</button>
 <button class="btn alt" ${canSend&&c.info_request?"":"disabled"} onclick="decide('Information request sent to provider')">Send information request</button>
 <button class="btn alt" ${canSend?"":"disabled"} onclick="decide('Routed to physician queue')">Route to physician</button>
 <button class="btn alt" ${canAdverse?"":"disabled"} onclick="decide('Adverse determination signed by physician')">Sign adverse determination</button>
 <button class="btn alt" ${canSend?"":"disabled"} onclick="decide('Recommendation overridden: '+(prompt('Reason for override (required)')||'no reason given'))">Override</button>
 <div class="muted">The tool has no deny button. Only the physician role can sign an adverse determination. Nothing is written to PACE.</div>
 ${S.live?`<button class="btn alt" onclick="rerun()">Run review again, live</button>`:""}</div>
 <div class="card"><h2>Audit trail for this run</h2><div class="muted">Model ${esc(c.model)}, prompt ${esc(c.prompt_version)}, ${c.usage.calls||0} model calls, ${c.usage.in||0} tokens in, ${c.usage.out||0} out, ${c.latency_s}s</div>
 <ul class="trace">${(c.trace||[]).map(t=>`<li><b>${t.step}</b> ${esc(JSON.stringify(Object.fromEntries(Object.entries(t).filter(([k])=>k!="step"))))}</li>`).join("")}</ul></div></div></div>`}
function decide(action){const a=audit();a.push({ts:new Date().toISOString().slice(0,19).replace("T"," "),case_id:S.cur.case.case_id,role:S.me.name+" ("+role()+")",action,tool_outcome:S.cur.result.outcome,model:S.cur.model});localStorage.setItem("audit",JSON.stringify(a));render()}
async function rerun(){$("#view").insertAdjacentHTML("afterbegin",'<div class="banner">Running live review...</div>');const r=await api("/api/review",{case_id:S.cur.case.case_id}).catch(x=>({error:String(x)}));if(r.error)return alert(r.error);r.expected=S.cur.expected;S.cases[S.cases.indexOf(S.cur)]=r;S.cur=r;render()}
function evidence(){const e=S.ev,s=e.summary,p=(a,b)=>(100*a/b).toFixed(1)+"%",sc=S.score;
 return `<div class="tiles" style="margin-bottom:12px"><div class="tile"><div class="n">${p(s.tool_correct,s.n)}</div><div class="l">Tool agrees with the QA auditor</div><div class="s">${s.tool_correct} of ${s.n} audited cases</div></div>
 <div class="tile"><div class="n">${p(s.human_correct,s.n)}</div><div class="l">Human reviewers, same cases</div><div class="s">${s.human_correct} of ${s.n}. Contract standard is 95%</div></div>
 <div class="tile"><div class="n">${s.wrong_approvals.length}</div><div class="l">Wrongful approvals</div><div class="s">Cases the tool called approve-ready that the auditor did not</div></div>
 <div class="tile"><div class="n">${s.outside_allowed}</div><div class="l">Denials issued by the tool</div><div class="s">Not possible by design, and tested</div></div>
 <div class="tile"><div class="n">${s.adversarial_passed}/${s.adversarial_total}</div><div class="l">Adversarial, incomplete and wrong-input tests</div></div>
 <div class="tile"><div class="n">${sc.matched}/${sc.total}</div><div class="l">Open queue vs answer key</div></div></div>
 <div class="card"><h2>By the kind of mistake the human reviewer made</h2><table><tr><th>Auditor's error type on the original human decision</th><th>Tool correct</th></tr>${Object.entries(s.by_error_type).map(([k,v])=>`<tr><td>${k=="NONE"?"No human error":k}</td><td>${v[0]} of ${v[1]}</td></tr>`).join("")}</table>
 <div class="muted">Governing document and version correct on ${s.source_correct} of ${s.n}. Average ${s.avg_latency}s and ${s.avg_tokens_in+s.avg_tokens_out} tokens per case with ${esc(s.model)}.</div></div>
 <div class="card"><h2>Adversarial, incomplete and wrong inputs</h2><table><tr><th>Test</th><th>Expected</th><th>Got</th><th>Result</th></tr>${e.adversarial.map(a=>`<tr><td>${esc(a.test)}</td><td>${chip(a.expected)}</td><td>${chip(a.got)}</td><td class="${a.passed?"MET":"NOT_MET"} st">${a.passed?"PASS":"FAIL"}</td></tr>`).join("")}</table></div>
 <div class="card"><h2>Every miss on the audited cases</h2><table><tr><th>Case</th><th>Service</th><th>Auditor</th><th>Tool</th></tr>${e.qa.filter(r=>r.tool!=r.truth).map(r=>`<tr><td>${r.id} ${r.client}</td><td>${esc(r.service)}</td><td>${r.truth}</td><td>${r.tool}</td></tr>`).join("")}</table></div>`}
function ask(){return `<div class="card"><h2>Ask the policy library</h2><div class="muted">Search is limited to the documents in force for the client and date you pick. Retired versions and memos come back labelled, never as the rule.</div>
 <div class="grid" style="margin-top:8px"><div><label>Question<textarea id="q" rows="3">How many weeks of conservative therapy are needed before a lumbar MRI?</textarea></label></div>
 <div><label>Client <select id="qc" class="f">${["HARLAN","KESTREL","BRIGHT","JUNIPER","SORREL","OSTR","RB-MA","RB-ACA"].map(c=>`<option>${c}</option>`).join("")}</select></label>
 <label>Service <select id="qs" class="f">${SVC.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("")}</select></label><label>Date of service <input type="date" id="qd" value="2026-10-02"></label></div></div>
 <button class="btn" onclick="doAsk()">Ask</button><div id="ans"></div></div>`}
async function doAsk(){$("#ans").innerHTML='<div class="muted">Searching...</div>';const r=await api("/api/ask",{question:$("#q").value,client_id:$("#qc").value,service_code:$("#qs").value,date_of_service:$("#qd").value}).catch(e=>({error:String(e)}));
 $("#ans").innerHTML=r.error?`<div class="banner">${esc(r.error)}</div>`:`<h3>Answer</h3><pre>${esc(r.answer)}</pre><div class="muted">Citations: ${esc((r.citations||[]).join("; "))}</div><h3>Passages retrieved</h3>${r.hits.map(h=>`<div><span class="flag ${h.status=="GOVERNING"?"":"hot"}">${h.status}</span> <b>${h.doc_id} ${h.version||""} s${h.section}</b> <span class="muted">${esc(h.text.slice(0,160))}...</span></div>`).join("")}${(r.excluded||[]).map(e=>`<div class="ex">&#10005; ${e.doc_id} ${e.version||""}: <span class="muted">${esc(e.reason)}</span></div>`).join("")}`}
const SVC=[["BHA-IMG-0721","Lumbar spine MRI"],["BHA-SURG-4310","Bariatric surgery"],["BHA-DME-2103","Continuous glucose monitor"],["BHA-DX-9581","In-lab sleep study"],["BHA-SURG-2988","Knee arthroscopy"],["BHA-SURG-2744","Total knee replacement"],["BHA-LAB-8162","BRCA genetic test"],["BHA-SURG-1582","Upper eyelid surgery"],["BHA-SURG-3052","Septoplasty"],["BHA-SURG-6350","Spinal cord stimulator trial"],["BHA-VASC-3647","Varicose vein ablation"],["BHA-THER-1830","Hyperbaric oxygen"],["BHA-RAD-5205","Proton beam therapy"],["BHA-REH-9711","Physical therapy beyond 12 visits"],["BHA-IMG-7519","Coronary CT angiography"],["BHA-HH-0550","Home health"],["BHA-DME-0601","CPAP continued coverage"]];
function tryIt(){return `<div class="card"><h2>New request: phone call, portal or electronic</h2><div class="muted">This is the screen a call-center agent or intake coordinator uses while the provider is on the line. The same pipeline runs for every channel. Try changing the date of service to before or after a policy change, or leave out the therapy sentence, and watch the outcome change.</div>
 <div class="grid" style="margin-top:8px"><div><label>Channel <select id="tch" class="f"><option>PHONE</option><option>PORTAL</option><option>ELECTRONIC</option></select></label>
 <label>Client <select id="tc" class="f">${["HARLAN","KESTREL","BRIGHT","JUNIPER","SORREL","OSTR","RB-MA","RB-ACA"].map(c=>`<option>${c}</option>`).join("")}</select></label>
 <label>Member ID (optional) <input type="text" id="tm" placeholder="for example BHA30169508"></label>
 <label>Service <select id="ts" class="f">${SVC.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("")}</select></label><label>Date of service <input type="date" id="td" value="2025-12-15"></label>
 <label>Urgency <select id="tu" class="f"><option>STANDARD</option><option>URGENT</option></select></label></div>
 <div><label>Clinical notes (typed by the agent, or pasted from the portal)<textarea id="tn" rows="11">Patient presents with low back pain radiating down the left leg in an L5 distribution with positive straight-leg raise. Has completed 5 weeks of PT and scheduled naproxen without adequate relief. Requesting MRI lumbar spine without contrast.</textarea></label></div></div>
 <button class="btn" onclick="doTry()" ${S.live?"":"disabled"}>Run review</button> ${S.live?"":'<span class="muted">Not available: your role is read-only, or live mode is off on this server.</span>'}</div><div id="tr"></div>`}
async function doTry(){$("#tr").innerHTML='<div class="banner">Running: completeness check, resolve rules, read sections, check criteria, verify...</div>';const r=await api("/api/review",{custom:{channel:$("#tch").value,client_id:$("#tc").value,member_id:$("#tm").value.trim(),service_code:$("#ts").value,date_of_service:$("#td").value,urgency:$("#tu").value,clinical_notes:$("#tn").value}}).catch(e=>({error:String(e)}));
 if(r.error){$("#tr").innerHTML=`<div class="banner">${esc(r.error)}</div>`;return}S.cur=r;$("#tr").innerHTML=caseView(r)}
function how(){const ch=[["FAX","46% of requests","A fax image lands on the fax share. Nobody has typed anything.","A vision model transcribes the form into fields (member ID, service, date, diagnosis code, clinical text). Blank fields are detected. The fax timestamp starts the clock."],
 ["PORTAL","31%","The provider fills a web form. The portal calls our webhook with structured fields and notes.","No reading step needed. Fields arrive structured, so the request goes straight to the completeness check."],
 ["PHONE","15%","A provider office calls. Today the call-center agent keys the request into PACE during the call.","The agent types into the New request screen (or PACE, which we read through the read replica). The tool does not listen to calls or transcribe audio. The agent sees what is missing while the caller is still on the line."],
 ["ELECTRONIC","8%","A hospital system sends a standard X12 278 transaction through a clearinghouse. PACE creates the case.","Read from the PACE read replica as structured fields. Same pipeline from there."]];
 const steps=[["1 Intake and completeness","Code + model (fax only)","Every channel is turned into the same case record. Required fields are checked at once: member ID, service, date of service, clinical notes, diagnosis code. If anything is missing, a fax back to the provider is drafted in the first minute, listing exactly what to send. Text that tries to instruct the reviewer is flagged."],
 ["2 Member and clock","Code","Eligibility is checked on the date of service. The decision clock starts at receipt: 72 hours urgent, 7 days Riverbend Medicare Advantage, 15 days otherwise. State rules are attached (Arizona, Texas, Georgia)."],
 ["3 Which rules govern","Code","A registry of all 38 documents (type, client, version, effective dates, authority rank) selects the plan document, the Riverbend addendum and the policy version in force on the date of service. Retired versions and memos are excluded and shown with the reason."],
 ["4 Review","Model with tools","The model plans which sections to read, reads only governing documents, and checks every criterion. Each MET or NOT MET needs an exact quote from the clinical record. Identifiers are removed first."],
 ["5 Verify","Code + second model pass","Code rejects citations that are not in force, quotes that are not in the record, and outcomes that contradict the checklist. Every approval gets a skeptical second check. A failure goes to manual review."],
 ["6 Human decision","Person","The worklist is sorted by time left. A nurse confirms an approval. Intake sends the information request. Only a physician can sign an adverse determination. The tool has no deny outcome and writes nothing to PACE. Every action is logged."]];
 return `<div class="card"><h2>How a request arrives, by channel</h2><table><tr><th>Channel</th><th>Share</th><th>What arrives</th><th>How the copilot reads it</th></tr>${ch.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td></tr>`).join("")}</table>
 <div class="muted" style="margin-top:6px">In this queue: ${["FAX","PORTAL","PHONE","ELECTRONIC"].map(c=>S.cases.filter(x=>x.case.channel==c).length+" "+c.toLowerCase()).join(", ")}.</div></div>
 <div class="card"><h2>One pipeline for every request</h2><table><tr><th>Step</th><th>Who does it</th><th>What happens</th></tr>${steps.map(c=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td></tr>`).join("")}</table></div>
 <div class="card"><h2>Who can do what</h2><table><tr><th>Role</th><th>Run a review</th><th>Confirm approval</th><th>Send information request</th><th>Sign adverse determination</th></tr>
 ${[["Intake coordinator","Yes","No","Yes","No"],["Nurse reviewer","Yes","Yes","Yes","No"],["Physician reviewer","Yes","Yes","Yes","Yes"],["Auditor","No","No","No","No"],["The copilot itself","n/a","Never","Drafts only","Never"]].map(r=>`<tr>${r.map((x,i)=>`<td>${i?x:"<b>"+x+"</b>"}</td>`).join("")}</tr>`).join("")}</table>
 <div class="muted" style="margin-top:6px">The four outcomes: approve-ready, need information, route to physician, route as not covered. Roles are enforced on the server from your sign-in, not chosen on the page.</div></div>`}
function auditView(){const a=audit().reverse();return `<div class="card"><h2>Human decisions recorded in this browser</h2><div class="muted">In production this is a database table next to PACE, kept for Riverbend audits. Each model run also stores its inputs, sources, versions, tool trace and output (see "Audit trail" on any case).</div>
 <table><tr><th>Time</th><th>Case</th><th>Role</th><th>Action</th><th>Tool recommended</th></tr>${a.map(x=>`<tr><td>${x.ts}</td><td>${x.case_id}</td><td>${esc(x.role)}</td><td>${esc(x.action)}</td><td>${chip(x.tool_outcome)}</td></tr>`).join("")||'<tr><td colspan=5 class="muted">No decisions yet. Open a case and record one.</td></tr>'}</table></div>`}
function render(){$("#view").innerHTML={"Worklist":worklist,"Case review":()=>caseView(S.cur),"How it works":how,"New request":tryIt,"Evidence":evidence,"Ask the library":ask,"Audit log":auditView}[S.tab]()}
(async()=>{if(!TOKEN)return loginView();const me=await fetch("/api/login",{headers:{Authorization:"Bearer "+TOKEN}}).then(r=>r.ok?r.json():null).catch(()=>null);me?start(me):logout()})();
</script></body></html>
